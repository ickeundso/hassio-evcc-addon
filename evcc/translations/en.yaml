configuration:
  config_file:
    name: "Location of evcc.yaml (config_file)"
    description: >
      (OPTIONAL after 0.209.7) The location of the evcc.yaml could be /homeassistant/* or /config/* or /data/*. 
      Where /homeassistant/* maps to /config/* and /config/* maps to /addon_configs/<slug>_evcc/* and /data/* maps to /mnt/data/supervisor/addons/data/<slug>_evcc/* in Home Assistant OS. 
      To access /data/* within the evcc container follow https://docs.evcc.io/en/docs/installation/home-assistant.
  sqlite_file:
    name: "Location of evcc.db (sqlite_file)"
    description: >
      The location of the evcc.db could be /homeassistant/* or /config/* or /data/*. 
      Where /homeassistant/* maps to /config/* and /config/* maps to /addon_configs/<slug>_evcc/* and /data/* maps to /mnt/data/supervisor/addons/data/<slug>_evcc/* in Home Assistant OS. 
      To access /data/* within the evcc container follow https://docs.evcc.io/en/docs/installation/home-assistant.
  log_level:
    name: "Log level (log_level)"
    description: >
      (OPTIONAL) Log level evcc writes to the add-on log (Home Assistant journal): fatal, error, warn, info, debug or trace.
      Leave empty to keep the default (info, or the log setting of evcc.yaml).
      When set, it takes precedence over the log setting in evcc.yaml.
      The complete journal can be downloaded in evcc under Logs, download button, "All".
  OPTIMIZER_URI:
    name: "Optimizer API Endpoint (OPTIMIZER_URI)"
    description: >
      (OPTIONAL) The endpoint URL for the Optimizer API integration. 
      This setting allows evcc to communicate with the Optimizer service for advanced optimization, forecasting, and control features.
      Enter the full URL including protocol (e.g., for cloud https://evopt.evcc.io and local http://localhost:7050).
      Leave empty if not using EVopt features.
      Home Assistant Addon: https://github.com/thecem/hassio-evopt
  SEMP_BASE_URL:
    name: "SHM discovery URL (SEMP_BASE_URL)"
    description: >
      (OPTIONAL) Enter the URL through which the SMA Home Manager can reach evcc, e.g. http://your_evcc_ip_address:7070. 
      Leave empty if not using the SMA Home Manager as a meter.
